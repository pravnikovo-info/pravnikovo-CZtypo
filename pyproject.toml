[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pravnikovo-cstypo"
version = "0.2.0"
description = "Česká typografická pravidla jako kód: nezlomitelné mezery, zápis údajů, výstup pro typst"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{name = "pravnikovo.info"}]
keywords = ["czech", "typography", "typst", "nbsp", "vlna", "čeština", "typografie", "právní"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
    "Natural Language :: Czech",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
cstypo = "cstypo.cli:main"

[project.urls]
Repository = "https://github.com/pravnikovo-info/cstypo"
Changelog = "https://github.com/pravnikovo-info/cstypo/blob/main/CHANGELOG.md"
Issues = "https://github.com/pravnikovo-info/cstypo/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
