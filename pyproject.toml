[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pravnikovo-CZtypo"
version = "0.3.0"
description = "Česká typografie a sazba podání jako kód / Czech typography and legal typesetting as code (nbsp, case numbers, typst template, AI skill)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{name = "pravnikovo.info"}]
keywords = ["czech", "typography", "typst", "nbsp", "legal", "law", "agent-skills", "čeština", "typografie", "sazba", "právní"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
    "Natural Language :: Czech",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
cztypo = "cztypo.cli:main"

[project.urls]
Repository = "https://github.com/pravnikovo-info/pravnikovo-CZtypo"
Changelog = "https://github.com/pravnikovo-info/pravnikovo-CZtypo/blob/main/CHANGELOG.md"
Issues = "https://github.com/pravnikovo-info/pravnikovo-CZtypo/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
